name: Translate README to English

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: 'Path to the README file to translate'
        required: false
        default: 'README.md'
      source_language:
        description: 'Source language code (e.g., es, fr, de, auto for auto-detect)'
        required: false
        default: 'auto'
  push:
    paths:
      - 'README*.md'
      - '**/*README*.md'

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    name: Translate README to English
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install deep-translator

      - name: Create translation script
        run: |
          cat > translate.py << 'EOF'
          import sys
          import os
          from deep_translator import GoogleTranslator

          def translate_text(text, source_lang='auto', target_lang='en'):
              """Translate text to English using deep-translator"""
              try:
                  translator = GoogleTranslator(source=source_lang, target=target_lang)
                  # Split text into chunks if it's too long (Google Translate has a limit)
                  max_length = 4500
                  if len(text) <= max_length:
                      return translator.translate(text)

                  # Split by paragraphs and translate each
                  paragraphs = text.split('\n\n')
                  translated_paragraphs = []

                  for para in paragraphs:
                      if len(para) <= max_length:
                          translated_paragraphs.append(translator.translate(para))
                      else:
                          # Split long paragraphs into sentences
                          sentences = para.split('\n')
                          translated_sentences = []
                          for sentence in sentences:
                              if sentence.strip():
                                  translated_sentences.append(translator.translate(sentence))
                              else:
                                  translated_sentences.append('')
                          translated_paragraphs.append('\n'.join(translated_sentences))

                  return '\n\n'.join(translated_paragraphs)
              except Exception as e:
                  print(f"Translation error: {e}")
                  return text

          def main():
              source_file = sys.argv[1] if len(sys.argv) > 1 else 'README.md'
              source_lang = sys.argv[2] if len(sys.argv) > 2 else 'auto'

              if not os.path.exists(source_file):
                  print(f"Error: File {source_file} not found")
                  sys.exit(1)

              print(f"Reading {source_file}...")
              with open(source_file, 'r', encoding='utf-8') as f:
                  content = f.read()

              print(f"Translating from {source_lang} to English...")
              translated_content = translate_text(content, source_lang, 'en')

              # Create output filename
              base_name = os.path.basename(source_file)
              name_parts = os.path.splitext(base_name)
              output_file = f"{name_parts[0]}.en{name_parts[1]}"

              print(f"Writing translated content to {output_file}...")
              with open(output_file, 'w', encoding='utf-8') as f:
                  f.write(translated_content)

              print(f"Translation complete! Output saved to {output_file}")

              # Also write a summary
              with open('translation_summary.txt', 'w', encoding='utf-8') as f:
                  f.write(f"Source file: {source_file}\n")
                  f.write(f"Source language: {source_lang}\n")
                  f.write(f"Output file: {output_file}\n")
                  f.write(f"Original size: {len(content)} characters\n")
                  f.write(f"Translated size: {len(translated_content)} characters\n")

          if __name__ == '__main__':
              main()
          EOF

      - name: Run translation
        id: translate
        run: |
          SOURCE_FILE="${{ github.event.inputs.source_file || 'README.md' }}"
          SOURCE_LANG="${{ github.event.inputs.source_language || 'auto' }}"

          echo "Translating ${SOURCE_FILE} from ${SOURCE_LANG} to English..."
          python translate.py "${SOURCE_FILE}" "${SOURCE_LANG}"

          # Check if translation was successful and capture output filename
          if [ -f translation_summary.txt ]; then
            cat translation_summary.txt
            # Extract the output filename from the summary
            OUTPUT_FILE=$(grep "Output file:" translation_summary.txt | cut -d' ' -f3)
            echo "output_file=${OUTPUT_FILE}" >> $GITHUB_OUTPUT
            echo "translation_success=true" >> $GITHUB_OUTPUT
          else
            echo "translation_success=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit translated README
        if: steps.translate.outputs.translation_success == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add the specific translated file (not the summary, it's for artifacts only)
          OUTPUT_FILE="${{ steps.translate.outputs.output_file }}"
          if [ -f "${OUTPUT_FILE}" ]; then
            git add "${OUTPUT_FILE}"
          fi

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add English translation of README"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request (if on feature branch)
        if: steps.translate.outputs.translation_success == 'true' && github.ref != 'refs/heads/main'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Add English translation of README
          title: "📝 Add English Translation of README"
          body: |
            ## README Translation to English

            This PR adds an English translation of the README file.

            **Translation Details:**
            - Source file: ${{ github.event.inputs.source_file || 'README.md' }}
            - Source language: ${{ github.event.inputs.source_language || 'auto-detected' }}
            - Target language: English

            The translation was performed automatically using the translate-readme workflow.
          branch: translation-${{ github.run_number }}
          delete-branch: true

      - name: Upload translation summary
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: translation-summary
          path: |
            translation_summary.txt
            ${{ steps.translate.outputs.output_file }}
          retention-days: 30
